apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-config
data:
  NODE_ENV: development
  MONGODB_URI: mongodb://bookstore-mongodb:27017/bookstore
  RABBITMQ_URL: {{ .Values.microservices.rabbitmq.path | quote }} 
  BOOKS_QUEUE: {{ .Values.microservices.rabbitmq.queue | quote }}  
  AUTH_SERVICE_HOST: {{ .Values.microservices.auth.hostName | quote }} 
  AUTH_HOST: {{ .Values.microservices.auth.hostAddress | quote }} 
  AUTH_PORT: {{ .Values.microservices.auth.port | quote }} 
  EXPIRATION_TIME: "3600"
 