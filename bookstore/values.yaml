mongodb:
  architecture: standalone
  auth:
    enabled: true
    username: bookstore-user
    database: bookstore
  persistence:
    enabled: true
    size: 1Gi

rabbitmq:  
  persistence:
    enabled: true
    size: 1Gi

microservices:
  rabbitmq:
    queue: books-queue
  auth:
    hostName: auth
    hostAddress: "0.0.0.0"
    image: auth:dev
    pullPolicy: Never 
    port: 3001
  books:
    image: books:dev
    pullPolicy: Never 
    port: 3000
  gateway:
    image: bookstore-api-gateway:dev
    pullPolicy: Never 
    port: 3000
